[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools-scm"]

[project]
name = "openfisca-ch_sg"
version = "0.0.1"
description = "OpenFisca Rules as Code model for CH SG."
readme = "README.md"
keywords = [ "benefit", "microsimulation", "rac", "rules-as-code", "tax" ]
maintainers = [  ]
authors = [  ]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 1 - Planning",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license="AGPL-3.0-or-later"

dependencies = [
    "openfisca-core[web-api]>=44.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9,<1",
    "ruff-lsp>=0.0.57,<1",
    "yamllint>=1.35.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6.9,<1",
    "ruff-lsp>=0.0.57,<1",
    "yamllint>=1.35.1",
    "twine",
    "pre-commit>=4.3.0",
]

[project.urls]
Changelog = "git://github.com/MattiSG/openfisca-CH-SG.git/blob/main/CHANGELOG.md"
Documentation = "https://openfisca.org/doc"
Homepage = "git://github.com/MattiSG/openfisca-CH-SG.git"
Issues = "git://github.com/MattiSG/openfisca-CH-SG.git/issues"
Repository = "git://github.com/MattiSG/openfisca-CH-SG.git"

[tool.ruff]
target-version = "py39"
format.docstring-code-line-length = 72
format.docstring-code-format = true
lint.pydocstyle.convention = "google"

[tool.ruff.lint.isort]
known-first-party = [ "openfisca_ch_sg" ]
combine-as-imports = true
force-single-line = false

[tool.pyproject-fmt]
column_width = 79
indent = 4
max_supported_python = "3.11"

[tool.pytest.ini_options]
addopts = "--exitfirst --showlocals --doctest-modules --disable-warnings --import-mode importlib"
testpaths = [ "openfisca_ch_sg/tests" ]
python_files = "**/*.py"
